<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>La Caja Sorpresa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: presentación a pantalla completa. Una escena por vez (título, 3 pop-ups, carga, 5 objetos,
   inventario, final), barra de progreso arriba y navegación abajo. Estética 8 bits con paleta tipo PICO-8,
   ventanas de bordes escalonados y sprites dibujados píxel a píxel. Una sola apariencia, a propósito. */
:root {
  --bg: #1d2b53;
  --bg-deep: #101536;
  --edge: #0a0d29;
  --paper: #fff1e8;
  --ink: #1d2b53;
  --red: #ff004d;
  --orange: #ffa300;
  --yellow: #ffec27;
  --lime: #00e436;
  --blue: #29adff;
  --lav: #83769c;
  --gray: #5f574f;
  --silver: #c2c3c7;
  --px: 'Press Start 2P', 'Courier New', monospace;
  --vt: 'VT323', 'Courier New', monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--bg), var(--bg-deep));
  color: var(--paper);
  font-family: var(--vt);
  font-size: 24px;
  line-height: 1.15;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  image-rendering: pixelated;
}
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100; background: repeating-linear-gradient(transparent 0 3px, rgba(0, 0, 0, .13) 3px 4px); }
button { font-family: inherit; }
p { margin: 0; }
:focus-visible { outline: 4px dashed var(--yellow); outline-offset: 4px; }

.stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.stars i { position: absolute; width: 4px; height: 4px; background: var(--paper); opacity: .8; animation: tw 2.4s steps(2) infinite; }
@keyframes tw { 50% { opacity: .15; } }

.deck { position: relative; z-index: 1; height: 100%; max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 4px 6px 0; }
.count { font: 10px/1.4 var(--px); color: var(--yellow); }
.dots { display: flex; gap: 5px; flex-wrap: wrap; }
.dots i { width: 12px; height: 12px; background: var(--gray); }
.dots i.seen { background: var(--lav); }
.dots i.cur { background: var(--yellow); box-shadow: 0 0 0 3px var(--edge); }

.stage { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; display: flex; padding: 14px 10px; }
.slide { margin: auto; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 22px; animation: appear .3s steps(4); }
@keyframes appear { from { opacity: 0; transform: translateY(10px); } }

.nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 6px 6px; }
.hint { flex: 1; min-width: 0; text-align: center; font-size: 20px; color: var(--silver); }

/* pixel UI */
.btn {
  font: 12px/1.3 var(--px); color: var(--ink); background: var(--yellow); border: 0; cursor: pointer; margin: 4px; padding: 14px 16px;
  box-shadow: 0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge), inset -4px -4px 0 0 rgba(0, 0, 0, .25), inset 4px 4px 0 0 rgba(255, 255, 255, .45);
}
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: translateY(4px); }
.btn.lime { background: var(--lime); }
.btn.red { background: var(--red); color: var(--paper); }
.btn.blue { background: var(--blue); }
.btn:disabled { background: var(--gray); color: var(--silver); cursor: not-allowed; filter: none; transform: none; }

.win {
  background: var(--paper); color: var(--ink); margin: 6px 4px; width: 100%; max-width: 620px;
  box-shadow: 0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge), 12px 12px 0 0 rgba(0, 0, 0, .4);
}
.win-title { background: var(--blue); color: var(--ink); padding: 9px 10px; font: 10px/1.4 var(--px); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.win-title .x { background: var(--red); color: var(--paper); padding: 2px 6px; }
.win.err .win-title { background: var(--red); color: var(--paper); }
.win.err .win-title .x { background: var(--paper); color: var(--red); }
.win.ok .win-title { background: var(--lime); }
.win-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; font-size: 27px; line-height: 1.1; min-width: 0; }
.win-body .q { font: clamp(13px, 3.4vw, 18px)/1.6 var(--px); }
.win-body .sub { color: var(--gray); font-size: 24px; }
.row { display: flex; gap: 14px; flex-wrap: wrap; }

.big { font: clamp(18px, 5vw, 38px)/1.55 var(--px); text-shadow: 4px 4px 0 var(--edge); text-align: center; text-wrap: balance; overflow-wrap: anywhere; }
.big .y { color: var(--yellow); }
.big .b { color: var(--blue); }
.badge { font: clamp(34px, 10vw, 72px)/1 var(--px); color: var(--red); background: var(--yellow); padding: .18em .3em .12em; box-shadow: 0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge), 8px 8px 0 0 rgba(0, 0, 0, .4); transform: rotate(-3deg); }
.blink { font: 12px/1.4 var(--px); color: var(--yellow); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.sprite { image-rendering: pixelated; display: block; }
.bob { animation: bob 1.2s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(-8px); } }

/* loading */
.blocks { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; background: var(--ink); padding: 5px; }
.blocks i { height: 22px; background: #0f1a40; }
.blocks i.on { background: var(--lime); }
.status { font-size: 26px; min-height: 1.2em; }

/* item */
.item { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 28px; align-items: center; width: 100%; max-width: 900px; }
.tile { width: 100%; max-width: 300px; justify-self: center; aspect-ratio: 1 / 1; display: grid; place-items: center; padding: 12%; background-color: var(--c); background-image: conic-gradient(rgba(255, 255, 255, .16) 25%, transparent 0 50%, rgba(255, 255, 255, .16) 0 75%, transparent 0); background-size: 32px 32px; box-shadow: 0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge), 12px 12px 0 0 rgba(0, 0, 0, .4); margin: 6px; }
.tile .sprite { width: 100%; height: auto; }
.item .win { max-width: none; }
.item h2 { font: clamp(14px, 3.6vw, 20px)/1.5 var(--px); margin: 0; overflow-wrap: anywhere; }
.tag { align-self: flex-start; font: 9px/1.4 var(--px); background: var(--c); color: var(--ink); padding: 5px 8px; box-shadow: 0 0 0 3px var(--edge); }
.tw { display: grid; }
.tw > * { grid-area: 1 / 1; }
.tw .ghost { visibility: hidden; }
.stat { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font: 9px/1.4 var(--px); }
.segs { display: flex; gap: 4px; }
.segs i { width: 20px; height: 18px; background: #cfc5bd; box-shadow: inset -4px -4px 0 0 rgba(0, 0, 0, .18); }
.segs i.on { background: var(--c); }
.use { border-top: 4px dashed var(--ink); padding-top: 12px; font-size: 24px; }
.use b { font: 9px/1.4 var(--px); display: block; margin-bottom: 6px; }

/* inventory */
.inv { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 16px; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; font-size: 22px; min-width: 0; overflow-wrap: anywhere; }
.slot .t { width: 100%; max-width: 120px; aspect-ratio: 1 / 1; display: grid; place-items: center; padding: 10%; background: var(--c); box-shadow: 0 0 0 4px var(--edge); }
.slot .t .sprite { width: 100%; height: auto; }

.msg { font-size: 27px; }

.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 12px; }
.opts .btn { overflow-wrap: anywhere; line-height: 1.5; }
.field { font: 16px/1.3 var(--px); text-transform: uppercase; letter-spacing: .2em; padding: 14px; border: 0; width: calc(100% - 8px); margin: 4px; background: #fff; color: var(--ink); box-shadow: 0 0 0 4px var(--edge); }
.codemsg { color: var(--red); min-height: 1.2em; font-size: 24px; }
button.slot { background: none; border: 0; padding: 0; color: inherit; font: inherit; font-size: 22px; line-height: 1.1; cursor: pointer; }
button.slot:hover .t { filter: brightness(1.12); }
button.slot small { display: block; font-size: 20px; color: var(--gray); }
.slot .qm { font: clamp(28px, 9vw, 44px)/1 var(--px); color: var(--paper); text-shadow: 4px 4px 0 var(--edge); }
.slot.unk .t { animation: bob 1.2s steps(2) infinite; }
@media (prefers-reduced-motion: reduce) { .slot.unk .t { animation: none; } }

/* pantalla del cupón: recompensa */
.coupon { position: relative; overflow: hidden; padding: 28px 8px; gap: 16px; }
.coupon > * { position: relative; z-index: 1; }
.coupon > .rays { position: absolute; z-index: 0; left: 50%; top: 50%; width: 170vmax; height: 170vmax; margin: -85vmax 0 0 -85vmax; background: repeating-conic-gradient(rgba(255, 236, 39, .22) 0 7.5deg, transparent 7.5deg 15deg); -webkit-mask-image: radial-gradient(circle, #000 0, transparent 24%); mask-image: radial-gradient(circle, #000 0, transparent 24%); animation: spin 20s steps(80) infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.coupon > .sparks { position: absolute; inset: 0; z-index: 0; }
.coupon > .flash { position: absolute; inset: 0; z-index: 5; background: #fff; opacity: 0; pointer-events: none; animation: flashOut .9s steps(9) backwards; }
@keyframes flashOut { from { opacity: 1; } }
.spark { --sc: var(--yellow); position: absolute; width: 4px; height: 4px; background: var(--sc); box-shadow: 4px 0 var(--sc), -4px 0 var(--sc), 0 4px var(--sc), 0 -4px var(--sc); animation: twinkle 1.1s steps(2) infinite; }
@keyframes twinkle { 50% { transform: scale(.4); opacity: .4; } }
.rarity { font: clamp(11px, 3vw, 16px)/1.5 var(--px); color: var(--yellow); background: var(--edge); padding: 8px 14px; box-shadow: 0 0 0 4px var(--yellow); animation: dropIn .6s steps(6) .2s backwards, rainbow 1s steps(1) infinite; }
@keyframes dropIn { from { transform: translateY(-140px); opacity: 0; } }
@keyframes rainbow { 0% { color: #ff004d; } 20% { color: #ffa300; } 40% { color: #ffec27; } 60% { color: #00e436; } 80% { color: #29adff; } }
.hype { color: var(--yellow); animation: zoomIn .7s steps(7) .45s backwards; }
@keyframes zoomIn { from { transform: scale(4); opacity: 0; } }
.ticket { position: relative; display: flex; flex-wrap: wrap; width: 100%; max-width: 640px; margin: 6px 4px; background: var(--paper); color: var(--ink); transform: rotate(-1.5deg); box-shadow: 0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge), 12px 12px 0 0 rgba(0, 0, 0, .4); animation: ticketPop .9s steps(9) .9s backwards, floaty 2.4s steps(2) 1.9s infinite; }
@keyframes ticketPop { 0% { transform: scale(0) rotate(-25deg); } 70% { transform: scale(1.15) rotate(5deg); } }
@keyframes floaty { 50% { transform: translateY(-6px) rotate(-1.5deg); } }
.t-left { flex: 0 0 170px; display: grid; place-items: center; padding: 16px; background-color: var(--blue); background-image: conic-gradient(rgba(255, 255, 255, .16) 25%, transparent 0 50%, rgba(255, 255, 255, .16) 0 75%, transparent 0); background-size: 32px 32px; border-right: 4px dashed var(--ink); }
.t-left .sprite { width: 100%; max-width: 130px; height: auto; }
.t-right { flex: 1 1 240px; min-width: 0; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
.t-head { font: 9px/1.4 var(--px); color: var(--red); }
.t-title { font: clamp(13px, 3.2vw, 18px)/1.5 var(--px); margin: 0; overflow-wrap: anywhere; }
.t-row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: 25px; }
.t-row b { font: 9px/1.4 var(--px); min-width: 66px; }
.barcode { height: 26px; background: repeating-linear-gradient(90deg, var(--ink) 0 3px, transparent 3px 5px, var(--ink) 5px 6px, transparent 6px 10px, var(--ink) 10px 14px, transparent 14px 16px); }
.t-foot { font-size: 21px; color: var(--gray); }
.ticket .stamp { position: absolute; right: 10px; bottom: 46px; max-width: 170px; font: 9px/1.5 var(--px); text-align: center; color: var(--red); background: rgba(255, 241, 232, .92); border: 4px solid var(--red); padding: 6px 8px; transform: rotate(-12deg); animation: stampIn .5s steps(5) 1.9s backwards; }
@keyframes stampIn { from { opacity: 0; transform: rotate(-12deg) scale(4); } }
.stage.shake { animation: stageShake .5s steps(5); }
@keyframes stageShake { 20% { transform: translate(-8px, 4px); } 40% { transform: translate(8px, -4px); } 60% { transform: translate(-6px, -2px); } 80% { transform: translate(6px, 2px); } }
@media (max-width: 560px) {
  .t-left { flex: 1 1 100%; border-right: 0; border-bottom: 4px dashed var(--ink); }
  .t-left .sprite { max-width: 110px; }
  .ticket .stamp { bottom: 56px; }
}
@media (prefers-reduced-motion: reduce) { .rays, .spark, .rarity, .hype, .ticket, .stamp, .flash, .stage.shake { animation: none; } }
.sign { align-self: flex-end; font: 10px/1.4 var(--px); }

/* error layer */
.layer { position: fixed; inset: 0; z-index: 50; background: rgba(10, 13, 41, .78); display: grid; place-items: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.layer .win { animation: shake .35s steps(6); }
@keyframes shake { 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

@media (max-width: 520px) {
  body { font-size: 22px; }
  .win-body { padding: 16px; font-size: 24px; }
  .btn { font-size: 11px; padding: 12px 12px; }
  .blocks i { height: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .stars i, .blink, .bob, .slide, .layer .win { animation: none; }
}
</style>

function sprite(name, cls) {
  const s = SPRITES[name], c = document.createElement('canvas');
  c.width = 16; c.height = 16;
  const ctx = c.getContext('2d');
  s.rows.forEach((row, y) => { for (let x = 0; x < 16; x++) { const ch = row[x]; if (ch && s.pal[ch]) { ctx.fillStyle = s.pal[ch]; ctx.fillRect(x, y, 1, 1); } } });
  c.className = 'sprite' + (cls ? ' ' + cls : '');
  c.setAttribute('role', 'img'); c.setAttribute('aria-label', s.label);
  return c;
}
function win(title, nodes, cls) {

    const draw = p => {
      const on = Math.floor(p / 5);

      p += 2; draw(Math.min(p, 100));
      if (p >= 100) { clearInterval(loadT); passed[idx] = true; update(); }

/* fanfarria de 8 bits (suena solo después de que la persona toca la pantalla) */
function jingle() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = new AC(), t0 = ctx.currentTime + .05;
    const seq = [[523.25, 0, .08], [659.25, .09, .08], [783.99, .18, .08], [1046.5, .27, .08], [783.99, .42, .08], [1046.5, .51, .08], [1318.5, .6, .8], [1568, .6, .8]];
    seq.forEach(([f, t, d]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0 + t);
      g.gain.exponentialRampToValueAtTime(.05, t0 + t + .01);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + t + d);
      o.connect(g); g.connect(ctx.destination); o.start(t0 + t); o.stop(t0 + t + d + .02);
    });
    setTimeout(() => { try { ctx.close(); } catch (_) {} }, 2000);
  } catch (_) {}
}

/* ============ Confeti ============ */
function confetti(n = 90, dur = 3200) {
  if (reduce) return;
  const c = $('#confetti'), ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const cols = ['#ffec27', '#ff004d', '#00e436', '#29adff', '#ffa300', '#fff1e8'];
  const ps = Array.from({ length: n }, () => ({ x: rand(0, c.width), y: rand(-c.height * .6, 0), vy: rand(2, 6), vx: rand(-1.2, 1.2), s: Math.floor(rand(2, 4)) * 4, c: cols[Math.floor(rand(0, cols.length))] }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.y += p.vy; p.x += p.vx; ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x / 4) * 4, Math.round(p.y / 4) * 4, p.s, p.s); });
    if (t - t0 < dur) requestAnimationFrame(frame); else ctx.clearRect(0, 0, c.width, c.height);
  })(t0);
}

/* ============ Navegación ============ */
function canAdvance(i) { const t = cfgs[i].type; return (t !== 'quiz' && t !== 'gate' && t !== 'load' && t !== 'inv') || !!passed[i]; }
function update() {
  const last = cur === N - 1, locked = !last && !canAdvance(cur);
  const nx = $('#next');
  nx.disabled = locked;
  nx.textContent = cfgs[cur].next || 'SIGUIENTE ▶';
  $('#prev').disabled = cur === 0;
  $('#hint').textContent = locked ? cfgs[cur].lock : '';
}
function render() {
  clearInterval(loadT); clearInterval(typeT);
  slides.forEach((s, i) => { s.hidden = i !== cur; });
  seen.add(cur);
  $('#count').textContent = 'PANTALLA ' + (cur + 1) + '/' + N;
  [...dotsBox.children].forEach((d, i) => { d.className = i === cur ? 'cur' : (seen.has(i) ? 'seen' : ''); });
  update();
  const s = slides[cur];
  if (s._run) s._run();
  if (s._type) s._type();
  if (cfgs[cur].type === 'end') confetti();
  $('#stage').scrollTop = 0;
}
function go(i) {
  if (i < 0 || i >= N) return;
  if (i > cur && !canAdvance(cur)) return;
  cur = i; render();
}
$('#prev').addEventListener('click', () => go(cur - 1));
$('#next').addEventListener('click', () => { if (cur === N - 1) go(0); else go(cur + 1); });
document.addEventListener('keydown', e => {
  if (!$('#layer').hidden) { if (e.key === 'Escape') closeError(); return; }
  if (e.key === 'ArrowRight') { if (!$('#next').disabled) $('#next').click(); }
  if (e.key === 'ArrowLeft') { if (!$('#prev').disabled) $('#prev').click(); }
});

render();
</script>

</body></html>
